<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Alexa Visualisierungsdiagnose</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#131722;color:#fff;font-family:sans-serif;overflow:hidden}
#screen{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
#status{position:fixed;left:16px;bottom:16px;padding:9px 12px;border-radius:8px;background:#243146;color:#fff;font-size:13px;z-index:9;pointer-events:none}
#status.hidden{display:none}
</style>
</head>
<body>
<div id="status" role="status">Visualisierung: Verbindung wird geprüft …</div>
<iframe id="screen" referrerpolicy="no-referrer" title="IP-Symcon Visualisierung"></iframe>
<script>
(function(){
  'use strict';
  var params = new URLSearchParams(location.search);
  var frame = document.getElementById('screen');
  var status = document.getElementById('status');
  var routeArg=params.get('route');
  var route=routeArg==='energie' || routeArg==='kacheltest' ? routeArg : 'kamera';
  var instanceId = Number(params.get('i') || 0);
  var token = params.get('token') || '';
  var src = params.get('src') || '';
  // NUR bei explizitem Modul-Opt-in; Kamera/Energie unveraendert.
  var compat = route==='kacheltest' && params.get('compat')==='1';
  var bootMode = compat && params.get('boot')==='url' ? 'url':'srcdoc';
  var originFallback=false;
  // Nur signiertes Kurzzeit-Ticket; das Passwort steht NICHT in der HTML-URL.
  var authTicket=params.get('authTicket')||'';
  var authVis=Number(params.get('authVis')||0);
  var autoLoginAllowed=compat && bootMode==='url' && instanceId>0 &&
    authVis>0 && /^[0-9]{10}\.[a-f0-9]{32}\.[a-f0-9]{64}$/.test(authTicket);
  var autoLoginUsed=false;
  var autoLoginTicks=0;
  var loaded = false;
  var sent = 0;
  function emit(stage,state,code,metrics){
    // Limit browser diagnostics even when a page is misbehaving.
    if (!instanceId || !token || sent++ > (route==='kacheltest' ? 65 : 30)) return;
    var event={
      instanceId:instanceId, token:token,route:route,
      stage:stage,status:state || 'unknown',code:code || 'none'
    };
    if(route==='kacheltest' && stage==='tile_snapshot' && metrics){
      event.metrics=metrics;
    }
    var payload = JSON.stringify(event);
    try {
      if(navigator.sendBeacon) {
        var ok = navigator.sendBeacon('/hook/iah-alexa-html-debug',
          new Blob([payload],{type:'application/json'}));
        if(ok)return;
      }
      fetch('/hook/iah-alexa-html-debug',{
        method:'POST',body:payload,headers:{'Content-Type':'application/json'},
        credentials:'omit',keepalive:true
      }).catch(function(){});
    } catch(e){}
  }
  function reportDom(){
    try {
      var doc=frame.contentDocument;
      if(!doc){emit('frame_dom','cross_origin');return;}
      var body=doc.body;
      emit('frame_dom',body && (body.children.length || body.textContent.trim().length)?'not_empty':'empty');
    } catch(e){emit('frame_dom','cross_origin');}
  }
  // Eigene, nicht-invasive Diagnose der Browser-Faehigkeiten.
  // Es werden ausschliesslich feste Statuswerte, nie Inhalte gesendet.
  function capability(name,probe){
    try {emit('tile_capability',probe()?'supported':'unsupported',name);}
    catch(e){emit('tile_capability','unsupported',name);}
  }

  // Automatische Anmeldung ist explizit opt-in und nur fuer /tile/ erlaubt.
  // Passwort wird bei sichtbarer Login-Maske per POST geholt, einmalig
  // im Speicher verwendet und weder in URL noch in Diagnosen geschrieben.
  function tileTryAutoLogin(){
    if(!autoLoginAllowed || autoLoginUsed || ++autoLoginTicks>75)return;
    var doc,win,inputs;
    try {
      win=frame.contentWindow;
      doc=frame.contentDocument;
      if(!win || !doc || win.location.origin!==location.origin ||
         !/^\/tile\/?$/.test(win.location.pathname))return;
      inputs=doc.querySelectorAll('input[type="password"]');
      if(inputs.length!==1 || inputs[0].disabled || !inputs[0].isConnected)return;
    }catch(e){return;}
    autoLoginUsed=true; // Niemals mehrfach Passwoerter abrufen/einloggen.
    emit('tile_autologin','ok','field_detected');
    fetch('/hook/iah-alexa-tile-credential',{
      method:'POST',credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        instanceId:instanceId,visualizationId:authVis,
        token:token,ticket:authTicket
      }),cache:'no-store'
    }).then(function(response){
      if(!response.ok)throw Error('credential_unavailable');
      return response.json();
    }).then(function(data){
      if(!data || data.ok!==true || typeof data.password!=='string'
         || data.password.length===0)throw Error('credential_unavailable');
      var pw=data.password;
      data.password=null;
      try{
        var active=doc.querySelector('input[type="password"]');
        if(active!==inputs[0] || !active.isConnected)throw Error('dom_changed');
        // React/Vue-kontrollierte Eingabefelder moeglichst kompatibel setzen.
        var descriptor=Object.getOwnPropertyDescriptor(win.HTMLInputElement.prototype,'value');
        if(descriptor && typeof descriptor.set==='function')
          descriptor.set.call(active,pw);
        else active.value=pw;
        active.dispatchEvent(new win.Event('input',{bubbles:true}));
        active.dispatchEvent(new win.Event('change',{bubbles:true}));
        pw=''; // Kein dauerhafter Klartext im umgebenden Script halten.
        emit('tile_autologin','ok','filled');
        var form=active.form;
        if(form){
          var submit=form.querySelector('button[type="submit"],input[type="submit"]');
          if(submit && !submit.disabled){
            submit.click();emit('tile_autologin','ok','submitted');return;
          }
          if(typeof form.requestSubmit==='function'){
            form.requestSubmit();emit('tile_autologin','ok','submitted');return;
          }
        }
        // Formlose Dialoge: Nur dann klicken, wenn genau ein aktiver
        // Button innerhalb des Passwort-Containers existiert.
        var parent=active.closest('[role="dialog"]') || active.parentElement;
        var buttons=parent?parent.querySelectorAll('button:not([disabled])'):[];
        if(buttons.length===1){
          buttons[0].click();emit('tile_autologin','ok','submitted');return;
        }
        emit('tile_autologin','ok','filled_only');
      }catch(e){emit('tile_autologin','error','dom_changed');}
    }).catch(function(){
      emit('tile_autologin','error','credential_unavailable');
    });
  }

  function tileReport(){
    if(route!=='kacheltest')return;
    try{
      var doc=frame.contentDocument;
      var win=frame.contentWindow;
      if(!doc || !win){emit('tile_render','cross_origin');return;}
      if(doc.querySelector('input[type="password"]')){
        emit('tile_render','login','password');
      }else{
        var count=doc.body?doc.body.querySelectorAll('*').length:0;
        // Anzahl bedeutet KEIN Beweis fuer korrekte React/Vue-Darstellung.
        emit('tile_render',count>25?'not_empty':'loading',count>25?'elements':'none');
      }
      if(!win.__iahTileDiagnosticsAttached){
        win.__iahTileDiagnosticsAttached=true;
        win.addEventListener('error',function(ev){
          if(ev.target && ev.target !== win){
            var tag=(ev.target.tagName||'').toLowerCase();
            emit('tile_frame_resource_error','error',
              tag==='script'?'script':tag==='link'?'stylesheet':tag==='img'?'image':'other');
          }else{emit('tile_frame_js_error','error');}
        },true);
        win.addEventListener('unhandledrejection',function(){emit('tile_frame_rejection','error');});
      }
    }catch(e){emit('tile_render','cross_origin');}
  }
  // Kachelvisualisierung: differenzierte Momentaufnahmen statt nur
  // iframe.onload. Ein geladenes HTML ist kein Nachweis, dass die SPA startet.
  // Nur Zaehler und vorgegebene Statuswerte, nie HTML, URLs, Login-Details
  // oder Fehlermeldungen aus der Kachelvisualisierung protokollieren.
  var tileInnerStorageReported=false;
  function countItems(query,doc){
    try {return Math.min(9999,doc.querySelectorAll(query).length);}
    catch(e){return 0;}
  }
  function tileSnapshot(phase){
    if(route!=='kacheltest')return;
    try {
      var doc=frame.contentDocument;
      var win=frame.contentWindow;
      if(!doc || !win){
        emit('tile_snapshot','cross_origin',phase);
        return;
      }
      var body=doc.body;
      var ready=doc.readyState;
      emit('tile_document',ready==='complete'?'complete':
        (ready==='interactive'?'interactive':'loading'),'ready_state');
      var nodeCount=body?Math.min(9999,body.querySelectorAll('*').length):0;
      var pwCount=countItems('input[type="password"]',doc);
      var root=doc.querySelector('#root, #app, #app-root, [data-reactroot]');
      var rootChildren=root?Math.min(9999,root.children.length):0;
      var resources=[];
      try {
        if(win.performance && typeof win.performance.getEntriesByType==='function'){
          resources=win.performance.getEntriesByType('resource') || [];
        }
      }catch(e){}
      var scriptRequests=0,styleRequests=0,apiRequests=0,otherRequests=0;
      for(var i=0;i<Math.min(resources.length,1000);i++){
        var type=(resources[i].initiatorType || '').toLowerCase();
        if(type==='script')scriptRequests++;
        else if(type==='css' || type==='link')styleRequests++;
        else if(type==='fetch' || type==='xmlhttprequest')apiRequests++;
        else otherRequests++;
      }
      var metrics={
        nodes:nodeCount,
        bodyChildren:body?Math.min(9999,body.children.length):0,
        scripts:countItems('script',doc),
        stylesheets:countItems('link[rel="stylesheet"], style',doc),
        images:countItems('img',doc),
        frames:countItems('iframe',doc),
        passwordInputs:pwCount,
        rootChildren:rootChildren,
        scriptRequests:scriptRequests,
        styleRequests:styleRequests,
        apiRequests:apiRequests,
        otherRequests:otherRequests
      };
      // Nur aggregierte HTTP-Statusklassen/Zaehler aus dem optionalen
      // Bootstrap; nie URLs, Cookie- oder Antwortdaten.
      if(compat){
        try{
          var counts=win.__iahTileResponseCounters;
          if(counts && typeof counts==='object'){
            for(var field of [
              'response2xx','response3xx','response4xx','response5xx',
              'responseFailed','responseJson','responseHtml','responseOther'
            ]){
              var number=counts[field];
              if(typeof number==='number' && number>=0 && number<=9999){
                metrics[field]=number;
              }
            }
          }
        }catch(ignored){}
      }
      var state=pwCount>0?'login':
        (!body || nodeCount<25?'loading':'not_empty');
      emit('tile_snapshot',state,phase,metrics);
      if(!tileInnerStorageReported){
        tileInnerStorageReported=true;
        try {
          var store=win.localStorage;
          var k='iah_tile_diagnostic';
          store.setItem(k,'1');
          store.removeItem(k);
          emit('tile_inner_storage','supported','local_storage');
        }catch(e){
          emit('tile_inner_storage','unsupported','local_storage');
        }
      }
    }catch(e){
      emit('tile_snapshot','cross_origin',phase);
    }
  }


  // Test-Helfer im selben, spaeter als srcdoc geladenen Dokument.
  // Wird vor den IP-Symcon-App-Skripten in <head> eingefuegt.
  function installTileStorageShim(){
    'use strict';
    var probeKey='iahTileCompatProbe';
    try{
      var nativeStorage=window.localStorage;
      nativeStorage.setItem(probeKey,'1');
      nativeStorage.removeItem(probeKey);
      window.__iahTileShimStatus='native';
      return;
    }catch(ignored){}
    var prefix='iah_tilestorage_';
    var session=null;
    var memory=Object.create(null);
    try{
      session=window.sessionStorage;
      session.setItem(prefix+'probe','1');
      session.removeItem(prefix+'probe');
    }catch(e){session=null;}
    function keys(){
      var all=[];
      if(session){
        for(var i=0;i<session.length;i++){
          var k=session.key(i);
          if(typeof k==='string' && k.slice(0,prefix.length)===prefix)
            all.push(k.slice(prefix.length));
        }
      }else{
        all=Object.keys(memory);
      }
      return all;
    }
    var storage={
      getItem:function(k){
        k=String(k);
        return session?session.getItem(prefix+k):
          (Object.prototype.hasOwnProperty.call(memory,k)?memory[k]:null);
      },
      setItem:function(k,v){
        k=String(k);v=String(v);
        if(session)session.setItem(prefix+k,v);else memory[k]=v;
      },
      removeItem:function(k){
        k=String(k);
        if(session)session.removeItem(prefix+k);else delete memory[k];
      },
      clear:function(){
        var all=keys();
        for(var i=0;i<all.length;i++)storage.removeItem(all[i]);
      },
      key:function(i){return keys()[Number(i)]||null;}
    };
    Object.defineProperty(storage,'length',{get:function(){return keys().length;}});
    try{
      Object.defineProperty(window,'localStorage',{
        configurable:true,enumerable:true,
        get:function(){return storage;}
      });
      if(window.localStorage!==storage)throw Error('shim_not_effective');
      window.__iahTileShimStatus=session?'session':'memory';
    }catch(e){window.__iahTileShimStatus='blocked';}
  }

  // Nur im expliziten Kacheltest-Experiment: vor dem Original-Symcon-Script
  // starten. Erfasst KEINE Adressen, Fehlermeldungen oder HTTP-Bodies.
  function installTileBootstrapDiagnostics(expectedHash){
    'use strict';
    var count=0;
    var counters={
      response2xx:0,response3xx:0,response4xx:0,response5xx:0,responseFailed:0,
      responseJson:0,responseHtml:0,responseOther:0
    };
    window.__iahTileResponseCounters=counters;
    function report(stage,code){
      if(count++>20)return;
      try{
        parent.postMessage({
          iahTileDiagnostics:1,stage:stage,code:code
        },'*'); // Only fixed status codes; parent validates source + origin.
      }catch(ignored){}
    }
    var wanted=(typeof expectedHash==='string' && /^#[0-9]{1,10}$/.test(expectedHash))
      ?expectedHash:'';
    if(wanted){
      try{
        // srcdoc verliert sonst das /tile/#12345 Fragment.
        // Dies stellt nur den Hash wieder her; die Dokument-URL bleibt about:srcdoc.
        window.location.hash=wanted;
      }catch(e){}
      report('tile_boot',window.location.hash===wanted?'hash_match':'hash_missing');
    }else{
      report('tile_boot','no_hash');
    }
    // Der eigentliche document-Pfad ist bei srcdoc normalerweise
    // "about:srcdoc", obwohl das numerische #ID-Fragment gesetzt ist.
    // Versuch, vor den Symcon-Skripten den originalen /tile/-Pfad
    // wiederherzustellen. Falls browserseitig verboten: keine Aenderung.
    var isSrcdoc=window.location.protocol==='about:';
    report('tile_location',isSrcdoc?'srcdoc_context':
      (window.location.pathname==='/tile/'?'tile_context':'other_context'));
    if(isSrcdoc){
      try{
        window.history.replaceState(window.history.state,'','/tile/'+wanted);
        report('tile_history',window.location.pathname==='/tile/'?
          'history_ok':'history_unchanged');
      }catch(e){
        report('tile_history','history_blocked');
      }
    }
    window.addEventListener('error',function(e){
      if(e.target && e.target!==window){
        var kind=(e.target.tagName||'').toLowerCase();
        report('tile_early_error',kind==='script'?'script':
          (kind==='link'?'stylesheet':'other'));
      }else{
        var name='';
        try{name=(e.error && e.error.name)||'';}catch(ignored){}
        report('tile_early_error',name==='SecurityError'?'security_error':
          (name==='TypeError'?'type_error':
          (name==='ReferenceError'?'reference_error':
          (name==='SyntaxError'?'syntax_error':'js_error'))));
      }
    },true);
    window.addEventListener('unhandledrejection',function(e){
      var name='';
      try{name=(e.reason && e.reason.name)||'';}catch(ignored){}
      report('tile_early_rejection',name==='SecurityError'?'security_error':
        (name==='TypeError'?'type_error':'other'));
    });
    function captureHttp(status,type){
      var key=status>=200&&status<300?'response2xx':
        (status>=300&&status<400?'response3xx':
        (status>=400&&status<500?'response4xx':
        (status>=500&&status<600?'response5xx':'responseFailed')));
      counters[key]=Math.min(9999,counters[key]+1);
      // Weder URL noch Antwort-Body lesen; nur Content-Type-Kategorie.
      var mime=String(type||'').toLowerCase();
      var bucket=mime.indexOf('json')!==-1?'responseJson':
        (mime.indexOf('text/html')!==-1?'responseHtml':'responseOther');
      counters[bucket]=Math.min(9999,counters[bucket]+1);
    }
    // Eingehende Antworten unveraendert an die IP-Symcon-App weiterreichen.
    try{
      if(typeof window.fetch==='function'){
        var originalFetch=window.fetch;
        window.fetch=function(){
          return originalFetch.apply(this,arguments).then(function(response){
            captureHttp(response.status,response.headers.get('content-type'));return response;
          },function(error){
            captureHttp(0,'');throw error;
          });
        };
      }
    }catch(ignored){}
    try{
      if(window.XMLHttpRequest && window.XMLHttpRequest.prototype){
        var originalSend=window.XMLHttpRequest.prototype.send;
        window.XMLHttpRequest.prototype.send=function(){
          try{
            this.addEventListener('loadend',function(){
              var contentType='';
              try{contentType=this.getResponseHeader('content-type')||'';}catch(e){}
              captureHttp(this.status,contentType);
            });
          }catch(ignored){}
          return originalSend.apply(this,arguments);
        };
      }
    }catch(ignored){}
    report('tile_boot','hooks_installed');
  }

  function loadTileWithStorageCompatibility(){
    emit('tile_compat','ok','fetch_start');
    var target;
    try{
      target=new URL(src,location.href);
      // Kein Proxy und niemals benutzerdefinierte externe Ziel-URL laden.
      if(target.origin!==location.origin || !/^\/tile\/?$/.test(target.pathname)){
        emit('tile_compat','error','target_rejected');frame.src=src;return;
      }
    }catch(e){
      emit('tile_compat','error','target_rejected');frame.src=src;return;
    }
    if(typeof fetch!=='function'){
      emit('tile_compat','error','fetch_failed');frame.src=src;return;
    }
    fetch(target.href,{
      method:'GET',credentials:'same-origin',cache:'no-store',redirect:'follow'
    }).then(function(response){
      if(!response.ok || !response.url ||
          new URL(response.url).origin!==target.origin ||
          !/^\/tile\/?$/.test(new URL(response.url).pathname)){
        throw Error('unexpected_response');
      }
      var mime=(response.headers.get('content-type')||'').toLowerCase();
      if(mime.indexOf('text/html')===-1)throw Error('not_html');
      return response.text();
    }).then(function(html){
      if(typeof html!=='string' || html.length>200000){
        emit('tile_compat','error','too_large');frame.src=src;return;
      }
      if(!/<head(?:\s[^>]*)?>/i.test(html)){
        emit('tile_compat','error','no_head');frame.src=src;return;
      }
      // srcdoc besitzt trotz <base> eine eigene about:srcdoc-URL.
      // Daher NUR experimentell, mit aufrufbarer Original-Variante.
      var base='<base href="'+target.origin+'/tile/">';
      // Nur eine numerische ID als Hash uebertragen (keine Query/Passwortdaten).
      var selectedHash=/^#[0-9]{1,10}$/.test(target.hash)?target.hash:'';
      var code='<scr'+'ipt>try{('+installTileBootstrapDiagnostics.toString()+')('+
        JSON.stringify(selectedHash)+');}catch(e){};try{('+
        installTileStorageShim.toString()+')();}catch(e){}</scr'+'ipt>';
      var patched=html.replace(/<head(?:\s[^>]*)?>/i,function(open){
        return open+base+code;
      });
      emit('tile_compat','ok','html_injected');
      frame.srcdoc=patched;
    }).catch(function(){
      emit('tile_compat','error','fetch_failed');
      frame.src=src; // Bei Fehlern Original, ohne Shim.
    });
  }

  // Funktionen nur fuer das SAME-ORIGIN-Bootstrap im eigenen Test-iframe.
  // Wird nicht fuer Kamera, Energie oder andere produktive Seiten gesetzt.
  if(compat && bootMode==='url'){
    window.__iahTileStorageShim=installTileStorageShim;
    window.__iahTileBootstrapDiagnostics=installTileBootstrapDiagnostics;
  }

  function loadTileWithRealUrl(){
    // Keine fremden Sites: nur der bestehende Modul-WebHook mit Token.
    var bootstrap=new URL('/hook/iah-alexa-shell',location.origin);
    bootstrap.searchParams.set('f','alexa-tile-url-bootstrap.html');
    bootstrap.searchParams.set('token',token);
    bootstrap.searchParams.set('src',src);
    emit('tile_compat','ok','url_bootstrap');
    frame.src=bootstrap.href;
  }

  // Nachrichten ausschliesslich von unserem iframe und derselben Origin,
  // mit festen erlaubten Kategorien an den geschuetzten WebHook weiterleiten.
  window.addEventListener('message',function(ev){
    if(!compat || ev.source!==frame.contentWindow || ev.origin!==location.origin)return;
    var data=ev.data;
    if(!data || data.iahTileDiagnostics!==1)return;
    if(data.stage!=='tile_boot' && data.stage!=='tile_early_error' &&
       data.stage!=='tile_early_rejection' &&
       data.stage!=='tile_location' && data.stage!=='tile_history' &&
       data.stage!=='tile_origin')return;
    var codes=[
      'no_hash','hash_match','hash_missing','hooks_installed',
      'security_error','type_error','reference_error','syntax_error',
      'js_error','script','stylesheet','other',
      'srcdoc_context','tile_context','other_context',
      'history_ok','history_unchanged','history_blocked',
      'origin_start','origin_injected','origin_invalid','origin_failed'
    ];
    if(codes.indexOf(data.code)<0)return;
    emit(data.stage,
      data.stage==='tile_boot' || data.code==='history_ok' ||
      data.code==='tile_context' ||
      data.code==='origin_start' || data.code==='origin_injected'
        ? 'ok':'error',data.code);
    if(data.stage==='tile_origin' &&
       (data.code==='origin_invalid' || data.code==='origin_failed') &&
       bootMode==='url' && !originFallback){
      // Save the original (less compatible) srcdoc experiment as fallback.
      originFallback=true;
      emit('tile_compat','error','origin_fallback');
      loadTileWithStorageCompatibility();
    }
  });
  emit('shell_boot','ok');
  if(route==='kacheltest'){
    capability('websocket',function(){return typeof WebSocket!=='undefined';});
    capability('indexed_db',function(){return !!window.indexedDB;});
    capability('local_storage',function(){
      var k='iah_tile_test';
      localStorage.setItem(k,'1');localStorage.removeItem(k);return true;
    });
    capability('session_storage',function(){
      var k='iah_tile_test';
      sessionStorage.setItem(k,'1');sessionStorage.removeItem(k);return true;
    });
  }
  if(!/^https:\/\//i.test(src)){
    status.textContent='Die Visualisierungsadresse ist ungültig.';
    emit('missing_src','invalid');
    return;
  }
  emit('iframe_start','ok');
  if(autoLoginAllowed){
    // DOM-Anmeldung erscheint teils erst NACH iframe.onload.
    var authPoll=setInterval(function(){
      tileTryAutoLogin();
      if(autoLoginUsed || autoLoginTicks>75)clearInterval(authPoll);
    },400);
  }
  frame.addEventListener('load',function(){
    loaded=true;
    emit('iframe_load','ok');
    reportDom();
    tileReport();
    if(compat){
      try{
        var shimState=frame.contentWindow.__iahTileShimStatus||'missing';
        var shimCode=shimState==='session'?'shim_session':
          (shimState==='memory'?'shim_memory':
          (shimState==='native'?'shim_native':
          (shimState==='blocked'?'shim_blocked':'shim_missing')));
        emit('tile_compat',
          shimState==='session'||shimState==='memory'||shimState==='native'
            ? 'supported':'unsupported',shimCode);
      }catch(e){emit('tile_compat','unsupported','shim_missing');}
    }
    if(route==='kacheltest'){
      tileSnapshot('onload');
      setTimeout(function(){tileReport();tileSnapshot('after_3s');},3000);
      setTimeout(function(){tileReport();tileSnapshot('after_8s');},8000);
      setTimeout(function(){tileSnapshot('after_15s');},15000);
    }
    status.className='hidden';
  });
  frame.addEventListener('error',function(){
    emit('iframe_error','error');
    status.textContent='Die Visualisierung konnte nicht geöffnet werden.';
  });
  window.addEventListener('error',function(e){
    if(e.target && e.target !== window){
      var type=(e.target.tagName || '').toLowerCase();
      emit('resource_error','error',
        type==='img'?'image':type==='script'?'script':type==='link'?'stylesheet':type==='iframe'?'iframe':'other');
    }else{emit('js_error','error');}
  },true);
  window.addEventListener('unhandledrejection',function(){emit('promise_error','error');});
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='hidden')emit('visibility_hidden','hidden');
  });
  window.addEventListener('pagehide',function(){emit('pagehide','hidden');});
  setTimeout(function(){
    if(!loaded){
      status.textContent='Webseite lädt nicht – Diagnose wurde gespeichert.';
      emit('iframe_timeout','timeout');
    }
  },10000);
  if(compat && bootMode==='url')loadTileWithRealUrl();
  else if(compat)loadTileWithStorageCompatibility();
  else frame.src=src;
})();
</script>
</body>
</html>
