name: PHP lint – Alexa KI RoomsCatalog
on:
  push:
    branches:
      - feature/home-agent-frageintent-diagnostics-20261030
      - feature/ki-roomscatalog-editor-20261030
      - feature/ki-cost-transparency-20261030
      - security/sanitize-logs-example-catalog-20261030
      - feature/voice-intent-navigation-apl-diagnostics-20261030
      - fix/roomscatalog-ipslist-checkbox-multiselect-20261031
      - fix/gethaus-legacy-tiles-before-ki-20261031
      - feature/alexa-500-log-buffer-eur-cost-20261031
      - fix/alexa-voice-navigation-route-priority-20261031
      - diagnostics/external-html-blank-screen-20261031
  pull_request:
    paths:
      - 'IPSAlexaHaussteuerung/**'
      - 'RoomsCatalogConfigurator/**'
      - 'tests/**'
      - 'docs/HomeAgentFrageIntent.json'
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Check PHP syntax
        run: |
          php -l IPSAlexaHaussteuerung/module.php
          php -l IPSAlexaHaussteuerung/resources/action_entry.php
          php -l IPSAlexaHaussteuerung/resources/helpers/KIHouseController.php
          php -l IPSAlexaHaussteuerung/resources/helpers/HouseQueryEngine.php
          php -l IPSAlexaHaussteuerung/resources/helpers/ArchiveHistoryEngine.php
          php -l IPSAlexaHaussteuerung/resources/helpers/EnergyQueryEngine.php
          php -l IPSAlexaHaussteuerung/resources/helpers/VoiceIntentRouter.php
          php -l IPSAlexaHaussteuerung/resources/helpers/ExternalHtmlProbe.php
          php -l IPSAlexaHaussteuerung/resources/helpers/ExternalHtmlBrowserReceiver.php
          php -l IPSAlexaHaussteuerung/resources/helpers/TileAutoLoginCredential.php
          php -l IPSAlexaHaussteuerung/resources/helpers/WebHookIcons.php
          php -l IPSAlexaHaussteuerung/resources/helpers/KIIntentParser.php
          php -l IPSAlexaHaussteuerung/src/KICostAccounting.php
          php -l IPSAlexaHaussteuerung/src/KICostTrait.php
          php -l IPSAlexaHaussteuerung/src/KICostCurrency.php
          php -l IPSAlexaHaussteuerung/src/AlexaLogBuffer.php
          php -l IPSAlexaHaussteuerung/src/AlexaLogTrait.php
          php -l IPSAlexaHaussteuerung/src/SystemConfigurationManager.php
          php -l IPSAlexaHaussteuerung/src/SystemNavigationEditor.php
          php -l IPSAlexaHaussteuerung/src/VoiceRuleEngine.php
          php -l IPSAlexaHaussteuerung/src/VoiceRuleLiteralReader.php
          php -l IPSAlexaHaussteuerung/src/VoiceRuleAiMatcher.php
          php -l IPSAlexaHaussteuerung/src/VoiceRulePreviewForm.php
          php -l IPSAlexaHaussteuerung/src/HouseQuestionContext.php
          php -l IPSAlexaHaussteuerung/src/VoiceLegacyMigration.php
          php -l IPSAlexaHaussteuerung/src/VoiceRuleEditorTrait.php
          php -l IPSAlexaHaussteuerung/src/LastAlexaInteractionTrait.php
          php -l IPSAlexaHaussteuerung/src/SystemNavigationMigration.php
          php -l IPSAlexaHaussteuerung/resources/helpers/NavigationRuntime.php
          php -l RoomsCatalogConfigurator/module.php
          php -l RoomsCatalogConfigurator/libs/DeviceTechnicalAudit.php
          php -l RoomsCatalogConfigurator/libs/DeviceTypeRegistry.php
          php -l RoomsCatalogConfigurator/libs/DeviceCapabilities.php
          php -l RoomsCatalogConfigurator/libs/ModuleDataSources.php
          php -l RoomsCatalogConfigurator/libs/DataSourceEditor.php
          php -l RoomsCatalogConfigurator/libs/DataSourceEditorTrait.php
          php -l RoomsCatalogConfigurator/libs/SafeAutoRepair.php
      - name: Check Alexa HTML diagnostic JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('IPSAlexaHaussteuerung/resources/html/alexa-diagnostic-shell.html').read_text()
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S)
          assert len(scripts) == 1, 'Expected one inline Alexa diagnostic script'
          Path('/tmp/iah-alexa-diagnostic.js').write_text(scripts[0])
          PY
          node --check /tmp/iah-alexa-diagnostic.js
      - name: Check Alexa Tile real-URL bootstrap JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('IPSAlexaHaussteuerung/resources/html/alexa-tile-url-bootstrap.html').read_text()
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S)
          assert len(scripts) == 1, 'Expected one inline Tile URL bootstrap script'
          Path('/tmp/iah-alexa-tile-url-bootstrap.js').write_text(scripts[0])
          PY
          node --check /tmp/iah-alexa-tile-url-bootstrap.js
      - name: Check JSON syntax
        run: |
          php -r 'json_decode(file_get_contents("IPSAlexaHaussteuerung/form.json"), true, 512, JSON_THROW_ON_ERROR);'
          php -r 'json_decode(file_get_contents("docs/HomeAgentFrageIntent.json"), true, 512, JSON_THROW_ON_ERROR);'
          php -r 'json_decode(file_get_contents("docs/Alexa_Hausfragen_Intent_Paket.json"), true, 512, JSON_THROW_ON_ERROR);'
      - name: Test RoomsCatalog KI permission checks
        run: php tests/test_ki_rooms_catalog.php
      - name: Test V3.4 typed RoomsCatalog multi-property KI and confirmed actuator guards
        run: php tests/test_ki_rooms_catalog_v34.php
