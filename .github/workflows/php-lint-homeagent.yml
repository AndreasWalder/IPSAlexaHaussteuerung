name: PHP lint – Alexa KI RoomsCatalog
on:
  push:
    branches:
      - feature/home-agent-frageintent-diagnostics-20261030
      - feature/ki-roomscatalog-editor-20261030
      - feature/ki-cost-transparency-20261030
      - security/sanitize-logs-example-catalog-20261030
      - feature/voice-intent-navigation-apl-diagnostics-20261030
      - fix/roomscatalog-ipslist-checkbox-multiselect-20261031
      - fix/gethaus-legacy-tiles-before-ki-20261031
  pull_request:
    paths:
      - 'IPSAlexaHaussteuerung/**'
      - 'RoomsCatalogConfigurator/**'
      - 'tests/**'
      - 'docs/HomeAgentFrageIntent.json'
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Check PHP syntax
        run: |
          php -l IPSAlexaHaussteuerung/module.php
          php -l IPSAlexaHaussteuerung/resources/action_entry.php
          php -l IPSAlexaHaussteuerung/resources/helpers/HomeAgentVoiceBridge.php
          php -l IPSAlexaHaussteuerung/resources/helpers/KIHouseController.php
          php -l IPSAlexaHaussteuerung/resources/helpers/VoiceIntentRouter.php
          php -l IPSAlexaHaussteuerung/resources/helpers/KIIntentParser.php
          php -l IPSAlexaHaussteuerung/src/KICostAccounting.php
          php -l IPSAlexaHaussteuerung/src/KICostTrait.php
          php -l RoomsCatalogConfigurator/module.php
      - name: Check JSON syntax
        run: |
          php -r 'json_decode(file_get_contents("IPSAlexaHaussteuerung/form.json"), true, 512, JSON_THROW_ON_ERROR);'
          php -r 'json_decode(file_get_contents("docs/HomeAgentFrageIntent.json"), true, 512, JSON_THROW_ON_ERROR);'
      - name: Test RoomsCatalog KI permission checks
        run: php tests/test_ki_rooms_catalog.php
      - name: Test RoomsCatalog form add/edit and persistent expansion
        run: php tests/test_rooms_catalog_editor_ui.php
      - name: Test Symcon IPSList checkbox callbacks and filtered multi-selection
        run: php tests/test_rooms_catalog_ipslist_multiselect.php
      - name: Test OpenAI token and cost accounting
        run: php tests/test_ki_cost_accounting.php
      - name: Test GPT-6 Luna and GPT-4.1 mini model selection
        run: php tests/test_ki_model_selection.php
      - name: Test public catalog and credential-safe Alexa logging
        run: php tests/test_security_hardening.php
      - name: Test Alexa UI voice/APL routing and diagnostics
        run: php tests/test_voice_intent_router.php
      - name: Test GetHaus Device-only legacy navigation before KI
        run: php tests/test_gethaus_legacy_navigation.php
