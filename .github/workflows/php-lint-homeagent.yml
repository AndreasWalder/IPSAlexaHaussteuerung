name: PHP lint – Alexa Home Agent
on:
  push:
    branches:
      - feature/home-agent-frageintent-diagnostics-20261030
  pull_request:
    paths:
      - 'IPSAlexaHaussteuerung/**'
      - 'docs/HomeAgentFrageIntent.json'
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Check PHP syntax
        run: |
          php -l IPSAlexaHaussteuerung/module.php
          php -l IPSAlexaHaussteuerung/resources/action_entry.php
          php -l IPSAlexaHaussteuerung/resources/helpers/HomeAgentVoiceBridge.php
      - name: Check JSON syntax
        run: |
          php -r 'json_decode(file_get_contents("IPSAlexaHaussteuerung/form.json"), true, 512, JSON_THROW_ON_ERROR);'
          php -r 'json_decode(file_get_contents("docs/HomeAgentFrageIntent.json"), true, 512, JSON_THROW_ON_ERROR);'
